# Override these startup parameters for your board and sensor mounting frames.
/**:
  ros__parameters:
    transport: ws
    device_uri: ""
    auto_connect: true
    auto_reconnect: true
    reconnect_interval: 2.0
    frame_id: axiom
    sensor_frames: '{}'
    topic_aliases: '{}'
    ws_pcol: RICSerial
    serial.port: ""
    serial.baud: 115200
    serial.timeout: 0.02
    serial.mode: auto
    autosub: true
    publish_rate_hz: 10.0
    publish_trigger: time
    rpc_default_timeout: 3.0
    sensor_qos.reliability: best_effort
    sensor_qos.depth: 10
    sensor_qos.overrides: "{}"
    publish_custom_messages: true
    range.field_of_view: 0.0
    metadata_refresh_s: 30.0
    receive_queue_depth: 256
    stale_after_s: 5.0
