set -g default-terminal "tmux-256color"
set -g mouse on
set -g history-limit 5000
set -g status-style "bg=#26333d,fg=#d7e4e5"
set -g pane-border-style "fg=#425562"
set -g pane-active-border-style "fg=#62aaa3"
set -g pane-border-status top
set -g pane-border-format " Terminal #{pane_index} "
set -g pane-base-index 1
set -g status-left " ROS "
set -g status-right "Ctrl+b arrows: pane · d: detach"
set -g status-left-length 10
set -g status-right-length 50
# The optional desktop has xclip; native Linux users can use terminal selection.
if-shell 'command -v xclip >/dev/null' 'bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"'
